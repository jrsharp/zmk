# chocv keyboard 9P configuration
#
# This configuration enables 9P over BLE L2CAP for the chocv keyboard,
# replacing the standard BLE HID (HOGP) profile with a 9P filesystem
# interface that exposes /kbd/kbin and /kbd/leds.

# ============================================
# MCUboot Bootloader Support
# ============================================
CONFIG_BOOTLOADER_MCUBOOT=y

# Delay boot to allow USB CDC ACM console connection before boot logs
# NOTE: Set to 0 for production to save 10s boot time and power
CONFIG_BOOT_DELAY=10000

# ============================================
# Power Management - nRF52840 DCDC & PM
# ============================================
# Enable DCDC converter - MUCH more efficient than LDO regulator
# Saves ~20-30% power across all operating modes
# (nice_nano board Kconfig provides BOARD_ENABLE_DCDC which selects SOC_DCDC_NRF52X)
CONFIG_BOARD_ENABLE_DCDC=y
# HV DCDC for VDDH (battery input) rail - disabled for stability with small LiPo
# Can cause brown-out resets on 110mAh batteries under load
CONFIG_BOARD_ENABLE_DCDC_HV=n

# Enable Zephyr power management framework
CONFIG_PM=y
# Device-level power management (suspend unused peripherals)
CONFIG_PM_DEVICE=y
# Runtime PM - devices auto-suspend when not in use
CONFIG_PM_DEVICE_RUNTIME=y
# Allow both runtime PM AND explicit suspend/resume (needed for deep sleep)
CONFIG_PM_DEVICE_RUNTIME_EXCLUSIVE=n

# ============================================
# Idle/Sleep Timeouts
# ============================================
# Idle state after 30s - reduces peripheral activity
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Deep sleep after 30 minutes of inactivity
# WARNING: BLE disconnects on sleep, first keypress wakes but is lost,
# ~5-7 seconds for full reconnection after wake
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# Soft-off support for proper wakeup handling
CONFIG_ZMK_PM_SOFT_OFF=y

# Disable ZMK BLE HID and USB HID - we're 9P-only (but keep USB for console)
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n

# Enable 9P support
CONFIG_NINEP=y
CONFIG_NINEP_SERVER=y
CONFIG_NINEP_TRANSPORT_L2CAP=y
CONFIG_NINEP_L2CAP_PSM=0x0081
CONFIG_NINEP_MAX_MESSAGE_SIZE=512
CONFIG_NINEP_MAX_FIDS=8
CONFIG_NINEP_MAX_TAGS=4

# 9PIS GATT service for iOS discovery (keeps 0x1001 for ESP32)
CONFIG_NINEP_GATT_9PIS=y

# 9P DFU - Firmware update via /dev/firmware
CONFIG_NINEP_DFU=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y

# BLE L2CAP for 9P
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_TX_MTU=247

# Debug logging - disable runtime filtering so compile-time levels take effect
CONFIG_LOG_RUNTIME_FILTERING=n
# NINEP debug disabled - channel is stable, reduce to warnings only
CONFIG_NINEP_LOG_LEVEL_WRN=y
# Suppress ZMK endpoint errors (we use 9P, not USB/BLE HID)
CONFIG_ZMK_LOG_LEVEL_OFF=y
# BT debug disabled - L2CAP channel is stable now
# CONFIG_BT_L2CAP_LOG_LEVEL_DBG=y
# CONFIG_BT_CONN_LOG_LEVEL_DBG=y

# ============================================
# Stack/Buffer Sizes - Tuned for Power
# ============================================
# Reduced from 8K - deferred logging needs less stack
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_HCI_TX_STACK_SIZE=1536
CONFIG_BT_CTLR_RX_PRIO_STACK_SIZE=1536
# System workqueue for 9P processing
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
# ZMK low priority workqueue for battery/Memfault
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1536
# Reduced RX buffers - relaxed connection params mean fewer concurrent packets
CONFIG_BT_CTLR_RX_BUFFERS=6
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Security - relaxed for now to debug L2CAP connection issues
CONFIG_BT_SMP=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_BONDABLE=y
# CONFIG_BT_SMP_SC_ONLY=y  # Disabled - was blocking L2CAP before pairing

# ============================================
# BLE Connection Parameters - Power Optimized
# ============================================
# Relaxed intervals (30-50ms) - keyboard doesn't need sub-30ms response
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
# Allow skipping up to 30 connection events when idle (~1.5s radio sleep)
# This is the biggest power win - radio stays off until data or timeout
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
# Supervision timeout 4s - must be > (1 + latency) * max_interval * 2
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# TX power: 0dBm is plenty for desk/pocket range, saves ~10-15% vs +8dBm
# Uncomment +8 only if experiencing connection issues at distance
CONFIG_BT_CTLR_TX_PWR_0=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable NFC pins as GPIOs (P0.09 and P0.10 are used for keyboard columns 0-1)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Enable heap for 9P malloc
# Thread pool allocates up to 8 messages × 512 bytes = 4KB for message buffers
# Plus other allocations, so use 8KB for headroom
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ============================================
# USB CDC Console (Debug Only)
# ============================================
# NOTE: USB draws ~5-10mA when enabled. For production, consider:
#   - CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n (init only when VBUS detected)
#   - Or remove USB entirely and use RTT for debug
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=512
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Enable Zephyr shell over USB
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_PROMPT_UART="kbd_9p:~$ "
CONFIG_SHELL_CMD_BUFF_SIZE=256

# Enable useful shell commands
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_BT_SHELL=y

# Enable logging over USB console
# DEFERRED mode is more power-efficient (batches log processing)
# Switch to IMMEDIATE only when debugging crashes
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=100
CONFIG_LOG_PRINTK=y
# Process logs in low-priority thread to avoid blocking main/BT threads
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=3
CONFIG_LOG_BUFFER_SIZE=4096
# Use shell log backend only (not UART) to avoid duplicate output
CONFIG_LOG_BACKEND_UART=n

# Enable debug support for better crash info
CONFIG_DEBUG_INFO=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_DEBUG_THREAD_INFO=y

# Enable Memfault for advanced crash debugging and coredumps
CONFIG_MEMFAULT=y

# Route all Zephyr logs to Memfault's RAM buffer (captures early boot logs)
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOGGING_RAM_SIZE=16384

# Use RAM-backed coredump storage (.noinit section)
# MCUboot does NOT clear RAM on reset, so this works now!
# (The old Adafruit bootloader cleared RAM, which is why we tried flash)
CONFIG_MEMFAULT_COREDUMP_COLLECT_KERNEL_REGION=y

# RAM coredump backend (default) - stored in .noinit, survives MCUboot reset
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP=y
CONFIG_MEMFAULT_RAM_BACKED_COREDUMP_SIZE=49152

# Don't return from fault handler - reset after saving coredump
CONFIG_MEMFAULT_FAULT_HANDLER_RETURN=n

CONFIG_MEMFAULT_HTTP_ENABLE=n
CONFIG_MEMFAULT_SHELL=y
# Capture full thread stacks for complete backtraces
CONFIG_MEMFAULT_COREDUMP_FULL_THREAD_STACKS=y
CONFIG_MEMFAULT_METRICS=n
CONFIG_MEMFAULT_INIT_PRIORITY=80

# Battery reporting (nice!nano uses nRF52840 VDDH ADC, no fuel gauge)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Disable sensor shell to avoid CBPRINTF_FP_SUPPORT dependency issue
CONFIG_SENSOR_SHELL=n
