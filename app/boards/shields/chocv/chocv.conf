# chocv keyboard 9P configuration
#
# This configuration enables 9P over BLE L2CAP for the chocv keyboard,
# replacing the standard BLE HID (HOGP) profile with a 9P filesystem
# interface that exposes /kbd/kbin and /kbd/leds.

# Disable ZMK BLE HID and USB HID - we're 9P-only (but keep USB for console)
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n

# Enable 9P support
CONFIG_NINEP=y
CONFIG_NINEP_SERVER=y
CONFIG_NINEP_TRANSPORT_L2CAP=y
CONFIG_NINEP_MAX_MESSAGE_SIZE=512
CONFIG_NINEP_MAX_FIDS=8
CONFIG_NINEP_MAX_TAGS=4

# BLE L2CAP for 9P
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_TX_MTU=247

# Security
CONFIG_BT_SMP=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SMP_SC_ONLY=y

# BLE Connection parameters for low latency
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Increase BLE TX power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable heap for 9P malloc
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Enable USB CDC ACM for console and shell
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=1024
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Enable Zephyr shell over USB
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_PROMPT_UART="kbd_9p:~$ "
CONFIG_SHELL_CMD_BUFF_SIZE=256

# Enable useful shell commands
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_BT_SHELL=y

# Enable logging over USB console
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
