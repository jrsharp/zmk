# Override for stock nice!nano v2 UF2 bootloader (with 9P over BLE)
# Use with the matching overlay to restore stock flash partitions:
#   west build -p -s app -b nice_nano_v2 -d app/build_chocv_stock -- -DSHIELD=chocv \
#     -DEXTRA_CONF_FILE=boards/shields/chocv/chocv_stock_bootloader.conf \
#     -DEXTRA_DTC_OVERLAY_FILE=boards/shields/chocv/chocv_stock_bootloader.overlay
#
# USB HID + 9P over BLE L2CAP. Overrides chocv.conf for stock bootloader.
# Flash via UF2: double-tap reset, copy zmk.uf2 to NICENANO drive.

# ============================================
# Disable MCUboot / DFU
# ============================================
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_NINEP_DFU=n
CONFIG_IMG_MANAGER=n
CONFIG_MCUBOOT_IMG_MANAGER=n
CONFIG_STREAM_FLASH=n
CONFIG_BOOT_DELAY=0

# ============================================
# USB HID output
# ============================================
CONFIG_ZMK_USB=y

# ============================================
# BLE enabled for 9P over L2CAP
# (chocv.conf already enables CONFIG_BT=y,
#  CONFIG_NINEP_GATT_9PIS=y, L2CAP, etc.
#  so we just leave those alone)
# ============================================

# ============================================
# Disable power management (no sleep, no soft-off)
# wakeup-source is disabled in overlay
# ============================================
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=n
CONFIG_PM=n
CONFIG_PM_DEVICE=n
CONFIG_PM_DEVICE_RUNTIME=n

# ============================================
# Disable logging, console, shell, CDC ACM
# ============================================
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USB_CDC_ACM=n
CONFIG_SHELL=n
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_BT_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_SERIAL=n

# ============================================
# Disable Memfault
# ============================================
CONFIG_MEMFAULT=n

# ============================================
# Heap for 9P allocations
# ============================================
CONFIG_HEAP_MEM_POOL_SIZE=8192
