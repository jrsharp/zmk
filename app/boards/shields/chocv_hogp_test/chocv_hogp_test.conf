# chocv HOGP baseline test configuration
#
# This is a minimal HOGP (standard ZMK BLE HID) config for power comparison
# against the 9P-over-L2CAP implementation. Settings match the 9P build
# where possible for fair comparison.

# ============================================
# Standard ZMK BLE HID (HOGP)
# ============================================
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=n

# ============================================
# Power Management - Match 9P build
# ============================================
CONFIG_BOARD_ENABLE_DCDC=y
CONFIG_BOARD_ENABLE_DCDC_HV=y

CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_EXCLUSIVE=n

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_PM_SOFT_OFF=y

# ============================================
# BLE Connection Parameters - Match 9P build
# ============================================
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

CONFIG_BT_CTLR_TX_PWR_0=y

# ============================================
# Minimal build - no debug overhead
# ============================================
CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_USB_DEVICE_STACK=n

# NFC pins as GPIOs (keyboard uses them)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
