# FRST Cyberterminal Corne (M1KB) - Shared Configuration
#
# Split keyboard with wired TRRS connection between halves.
# Central (left) connects to ESP32 terminal via 9P over BLE L2CAP.
#
# Copyright (c) 2025 Jon Sharp
# Co-authored by Claude (Anthropic)
# SPDX-License-Identifier: MIT

# ============================================
# Split Keyboard - Wired via TRRS
# ============================================
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_WIRED=y
CONFIG_ZMK_SPLIT_WIRED_PRIORITY=0
CONFIG_SERIAL=y

# ============================================
# Power Management - nRF52840 DCDC & PM
# ============================================
# Enable DCDC converter - MUCH more efficient than LDO regulator
CONFIG_BOARD_ENABLE_DCDC=y
# HV DCDC disabled for stability with 110mAh batteries
CONFIG_BOARD_ENABLE_DCDC_HV=n

# Enable Zephyr power management framework
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_RUNTIME_EXCLUSIVE=n

# ============================================
# Idle/Sleep Timeouts
# ============================================
# Idle state after 30s - reduces peripheral activity
CONFIG_ZMK_IDLE_TIMEOUT=30000
# Deep sleep after 30 minutes of inactivity
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# Soft-off support for proper wakeup handling
CONFIG_ZMK_PM_SOFT_OFF=y

# NFC pins as GPIOs (keyboard may use them)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
