# FRST Cyberterminal Corne - Main Half Configuration
#
# The main half runs 9P over BLE L2CAP to connect to the ESP32 terminal.
# It aggregates keys from both halves and provides the 9P filesystem interface.
#
# Uses stock nice!nano UF2 bootloader (double-tap reset to update).
# No MCUboot/DFU - simpler workflow for development.
#
# Copyright (c) 2025 Jon Sharp
# Co-authored by Claude (Anthropic)
# SPDX-License-Identifier: MIT

# ============================================
# Disable ZMK BLE/USB HID - We use 9P only
# ============================================
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n

# ============================================
# 9P over BLE L2CAP (to ESP32 terminal)
# ============================================
CONFIG_NINEP=y
CONFIG_NINEP_SERVER=y
CONFIG_NINEP_TRANSPORT_L2CAP=y
CONFIG_NINEP_L2CAP_PSM=0x0081
CONFIG_NINEP_MAX_MESSAGE_SIZE=512
CONFIG_NINEP_MAX_FIDS=8
CONFIG_NINEP_MAX_TAGS=4

# 9PIS GATT service for iOS discovery
CONFIG_NINEP_GATT_9PIS=y

# Flash access for NVS settings persistence
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ============================================
# BLE L2CAP for 9P
# ============================================
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_TX_MTU=247

# Security - bonding enabled for encrypted reconnects
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
# Privacy disabled - use stable public MAC for easy 1:1 terminal pairing
CONFIG_BT_PRIVACY=n

# ============================================
# BLE Connection Parameters - Power Optimized
# ============================================
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# TX power: 0dBm is plenty for desk range
CONFIG_BT_CTLR_TX_PWR_0=y

# ============================================
# Stack/Buffer Sizes
# ============================================
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_HCI_TX_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=1536
CONFIG_BT_CTLR_RX_BUFFERS=6
CONFIG_BT_BUF_ACL_RX_SIZE=251

# Heap for 9P malloc
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ============================================
# USB CDC Console (Debug Only)
# ============================================
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=512
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# Zephyr shell over USB
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_PROMPT_UART="frst_m1kb:~$ "
CONFIG_SHELL_CMD_BUFF_SIZE=256

# Useful shell commands
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_BT_SHELL=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=100
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_RUNTIME_FILTERING=n
CONFIG_NINEP_LOG_LEVEL_WRN=y
CONFIG_ZMK_LOG_LEVEL_OFF=y

# Debug support
CONFIG_DEBUG_INFO=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_DEBUG_THREAD_INFO=y

# ============================================
# Memfault - Disabled (no MCUboot = no coredump survival)
# ============================================
# Enable if needed for logging, but coredumps won't survive reset
# without MCUboot (Adafruit bootloader clears RAM)
CONFIG_MEMFAULT=n

# ============================================
# Sensor/ADC for battery monitoring
# ============================================
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Disable sensor shell to avoid CBPRINTF_FP_SUPPORT issue
CONFIG_SENSOR_SHELL=n
