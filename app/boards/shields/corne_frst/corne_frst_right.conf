# FRST Cyberterminal Corne - Right/Peripheral Half Configuration
#
# The peripheral half is minimal - just key scanning and wired transport.
# All BLE, USB, logging, and Memfault are disabled to save power.
#
# Copyright (c) 2025 Jon Sharp
# Co-authored by Claude (Anthropic)
# SPDX-License-Identifier: MIT

# ============================================
# Disable all wireless - wired split only
# ============================================
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n
CONFIG_BT=n

# ============================================
# USB CDC Console (for debugging)
# TODO: Disable for production to save power
# ============================================
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=512
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_BOOT_DELAY=5000

# ============================================
# Logging for debug
# ============================================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y

# ============================================
# Battery reporting (for split battery monitoring)
# ============================================
CONFIG_SENSOR=y
CONFIG_ADC=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# ============================================
# No bootloader features on peripheral
# ============================================
# Peripheral can still be flashed via SWD if needed
