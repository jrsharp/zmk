# FRST 36-key wired keyboard configuration
# Production config for FRST Model 4 terminal

# ============================================
# USB HID - optional fallback keyboard output
# Can be disabled to save power if only using 9P
# ============================================
CONFIG_ZMK_USB=y

# ============================================
# UART 9P Server - primary keyboard interface
# GP0 = TX, GP1 = RX, 115200 baud
# ============================================
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

CONFIG_UART_9P_SERVER=y
CONFIG_UART_9P_DEVICE="uart0"
CONFIG_UART_9P_RX_BUF_SIZE=512
CONFIG_UART_9P_KEY_RING_SIZE=64

# ============================================
# Heap for 9P server allocations
# ============================================
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ============================================
# Random number generator (for 9P protocol)
# ============================================
CONFIG_TEST_RANDOM_GENERATOR=y

# ============================================
# NVS for settings persistence
# ============================================
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ============================================
# Minimal logging (production)
# Set CONFIG_LOG=y and CONFIG_ZMK_USB_LOGGING=y for debug
# ============================================
CONFIG_LOG=n
CONFIG_CONSOLE=n
