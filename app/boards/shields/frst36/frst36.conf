# FRST 36-key wired keyboard configuration
# Phase 1: USB HID for basic testing

# ============================================
# USB HID - enabled for Phase 1 testing
# ============================================
CONFIG_ZMK_USB=y

# ============================================
# Console for debugging (disable for production)
# ============================================
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_ZMK_LOG_LEVEL_INF=y

# ============================================
# NVS for settings persistence
# ============================================
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
