# FRST 36-key wired keyboard configuration
# Phase 2: USB HID + UART echo test

# ============================================
# USB HID - keyboard output
# ============================================
CONFIG_ZMK_USB=y

# ============================================
# USB CDC ACM Console (debug via USB, not UART)
# This frees UART0 for 9P communication
# ============================================
CONFIG_USB_CDC_ACM=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n
CONFIG_UART_LINE_CTRL=y

# Ring buffer for serial
CONFIG_RING_BUFFER=y

# ============================================
# UART 9P Server (Phase 3)
# GP0 = TX, GP1 = RX, 115200 baud
# ============================================
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_9P_SERVER=y
CONFIG_UART_9P_DEVICE="uart0"
CONFIG_UART_9P_RX_BUF_SIZE=512
CONFIG_UART_9P_KEY_RING_SIZE=64

# ============================================
# Logging via USB CDC ACM
# ============================================
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=n
CONFIG_ZMK_LOG_LEVEL_INF=y

# ============================================
# Heap for 9P server allocations
# ============================================
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ============================================
# Random number generator (for 9P auth challenges)
# ============================================
CONFIG_TEST_RANDOM_GENERATOR=y

# ============================================
# NVS for settings persistence
# ============================================
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
