# FRST 36-key wired keyboard configuration
# 9P over UART to ESP32-S3 terminal

# ============================================
# Disable USB HID (keyboard output is 9P only)
# ============================================
CONFIG_ZMK_USB=n

# ============================================
# UART 9P Server (GP0 TX, GP1 RX, 115200 baud)
# ============================================
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

CONFIG_UART_9P_SERVER=y
CONFIG_UART_9P_DEVICE="uart0"
CONFIG_UART_9P_RX_BUF_SIZE=512
CONFIG_UART_9P_KEY_RING_SIZE=64
CONFIG_NINEP_UART_WORKER_THREAD=y

# ============================================
# MCUboot bootloader support
# ============================================
CONFIG_BOOTLOADER_MCUBOOT=y

# ============================================
# 9P DFU — firmware update via /dev/firmware
# ============================================
CONFIG_NINEP_DFU=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y

# ============================================
# Heap and 9P message size
# ============================================
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_NINEP_MAX_MESSAGE_SIZE=512

# ============================================
# Random number generator (9P protocol)
# ============================================
CONFIG_TEST_RANDOM_GENERATOR=y

# ============================================
# NVS for settings persistence
# ============================================
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# ============================================
# Layer indicator LED (WS2812 on GP16)
# ============================================
CONFIG_LAYER_INDICATOR=y

# ============================================
# Logging (UART1 on GP4, INF level, deferred)
# ============================================
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=100
CONFIG_USB_CDC_ACM=n
